name: Supernova Comment Admission Bridge

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: supernova-comment-admission
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/supernova-admit'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13'
      - name: Install frozen validation environment
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock
      - name: Reconcile all open Supernova PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/reconcile_open_prs.py
