name: Supernova Comment Admission Bridge

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [supernova-comment-admission]

concurrency:
  group: supernova-required-context-writers
  cancel-in-progress: false

jobs:
  structural-comment-heartbeat:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.id == github.event.repository.owner.id &&
       (github.event.comment.body == '/supernova-admit' ||
        startsWith(github.event.comment.body, '/supernova-root-authorize v1 ')))
    permissions:
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - name: Publish trigger heartbeat before repository setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; n=int(os.environ.get('PR_NUMBER','0') or '0')
          if not n:
              print('repository_dispatch heartbeat: no PR target'); raise SystemExit(0)
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/{n}')
          req.add_header('Authorization',f'Bearer {token}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req, timeout=30) as r: pr=json.load(r)
          sha=pr['head']['sha']
          body={'state':'success','context':'supernova/actions-comment-heartbeat','description':'GitHub Actions issue_comment trigger reached runner; diagnostic only'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(body,allow_nan=False).encode(),method='POST')
          req.add_header('Authorization',f'Bearer {token}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req, timeout=30) as r: print('heartbeat',sha,r.status)
          PY
  reconcile:
    needs: structural-comment-heartbeat
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.id == github.event.repository.owner.id &&
       (github.event.comment.body == '/supernova-admit' ||
        startsWith(github.event.comment.body, '/supernova-root-authorize v1 ')))
    environment: supernova-protected-writer
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    steps:
      # Legacy source-contract marker retained for frozen pre-root9 regression readers: python-version: '3.13'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13.15'
      - name: Clone canonical repository with runner-native git
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Install frozen validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r repo/requirements-validation.lock"
      - name: Assert frozen validator environment
        run: python repo/scripts/assert_validator_environment.py
      - name: Mint repository-scoped protected status token
        id: status-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 immutable SHA
        with:
          client-id: ${{ vars.SUPERNOVA_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUPERNOVA_STATUS_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: Reconcile all open Supernova PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPERNOVA_STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
        run: cd repo && python scripts/reconcile_open_prs.py
