name: Supernova v2.5 REST Diagnostics + Admission Reconciler

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [supernova-rest-branch-reconcile]

permissions:
  contents: read
  statuses: write

concurrency:
  group: supernova-required-context-writers
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact accepted main with no persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install hash-locked validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Assert frozen validator environment
        run: python scripts/assert_validator_environment.py
      - name: Run exact-main read-only diagnostics and admission reconciler
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # This script is GET-only and emits non-authoritative JSON diagnostics.
          python scripts/reconcile_branch_rest.py
          # This is the only status-writing program in this workflow.
          python scripts/reconcile_v25_admission.py
