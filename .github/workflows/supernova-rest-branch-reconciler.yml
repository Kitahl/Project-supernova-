name: Supernova v2.5 REST Audit + Admission Reconciler

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [supernova-rest-branch-reconcile]

permissions:
  contents: read
  statuses: write

concurrency:
  group: supernova-v25-rest-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Run exact-main rejection-only audit and admission reconciler
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts
          PYTHONPATH: /tmp
        run: |
          python3 - <<'PY'
          import os, urllib.request
          token=os.environ['GITHUB_TOKEN'];base=os.environ['BASE_URL']
          for name in ('generation_envelope_v25.py','reconcile_branch_rest.py','reconcile_v25_admission.py'):
              req=urllib.request.Request(f'{base}/{name}')
              req.add_header('Authorization',f'Bearer {token}')
              with urllib.request.urlopen(req,timeout=30) as r:
                  open('/tmp/'+name,'wb').write(r.read())
          PY
          python3 /tmp/reconcile_branch_rest.py
          python3 /tmp/reconcile_v25_admission.py
