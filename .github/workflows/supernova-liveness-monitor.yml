name: Supernova Receipt Liveness Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [supernova-liveness-monitor]

permissions:
  contents: read
  statuses: write

concurrency:
  group: supernova-receipt-liveness
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Assert frozen validator environment
        run: python scripts/assert_validator_environment.py
      - name: Resolve frozen active liveness contract
        id: contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GITHUB_TOKEN'];api='https://api.github.com/repos/'+repo
          def get(path,ref):
              url=api+'/contents/'+urllib.parse.quote(path,safe='/')+'?ref='+urllib.parse.quote(ref,safe='')
              r=urllib.request.Request(url);r.add_header('Authorization','Bearer '+token);r.add_header('Accept','application/vnd.github+json');r.add_header('X-GitHub-Api-Version','2022-11-28')
              try:
                  with urllib.request.urlopen(r,timeout=20) as z:return json.loads(z.read())
              except urllib.error.HTTPError as e:
                  if e.code==404:return None
                  raise
          s=get('state/CURRENT.json','main');state=json.loads(base64.b64decode(s['content']))
          cohort=state['active_cohort_id'];G=state['generation_head_sha'];path=f'liveness/{cohort}.json';c=get(path,G)
          out=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as f:
              f.write('generation='+G+'\n');f.write('present='+('true' if c is not None else 'false')+'\n')
          if c is not None:pathlib.Path('/tmp/liveness-contract.json').write_bytes(base64.b64decode(c['content']))
          else:print('Frozen liveness contract missing: fail closed.')
          PY
      - name: Evaluate exact GitHub receipt deadlines
        if: steps.contract.outputs.present == 'true'
        id: eval
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check_lane_liveness.py --contract /tmp/liveness-contract.json --out /tmp/liveness-result.json
      - name: Publish exact-generation liveness status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.contract.outputs.generation }}
          CONTRACT_PRESENT: ${{ steps.contract.outputs.present }}
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          present=os.environ.get('CONTRACT_PRESENT')=='true'; good=present and os.environ.get('EVAL_OUTCOME')=='success'
          state='success' if good else 'failure';desc='Receipt-deadline liveness '+('PASS' if good else ('FAIL missing frozen contract' if not present else 'FAIL'))
          body={'state':state,'context':'supernova/liveness','description':desc}
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['TARGET_SHA']}"
          r=urllib.request.Request(url,data=json.dumps(body).encode(),method='POST');r.add_header('Authorization','Bearer '+os.environ['GITHUB_TOKEN']);r.add_header('Accept','application/vnd.github+json');r.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(r,timeout=20) as z: print(z.status)
          PY
      - name: Enforce fail-closed liveness
        if: steps.contract.outputs.present != 'true' || steps.eval.outcome != 'success'
        run: exit 1
