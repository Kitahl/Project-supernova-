name: Supernova Root Epoch11 Stageability Repair Seed Amendment

on:
  workflow_run:
    workflows: ["Supernova Root Epoch11 Stageability Repair Seed"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: supernova-root-epoch11-stageability-repair-seed-amendment-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  candidate-diagnostics:
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'failure'
    outputs:
      pr_number: ${{ steps.bind.outputs.pr_number }}
      head_sha: ${{ steps.bind.outputs.head_sha }}
      base_sha: ${{ steps.bind.outputs.base_sha }}
      run_attempt: ${{ steps.bind.outputs.run_attempt }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Bind exact source-run PR head and base
        id: bind
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CANDIDATE_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          CANDIDATE_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$CANDIDATE_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$CANDIDATE_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Checkout exact candidate head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.bind.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact reviewed repair source fixture
        run: git fetch --no-tags origin 3bdefc9dd2382e46d56cb139160a6703fd50b599
      - name: Use frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install hash-locked validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Assert frozen validator environment
        run: python scripts/assert_validator_environment.py
      - name: Candidate diagnostics only
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          SUPERNOVA_REQUIRE_REAL_ROOT11_FIXTURE: "1"
        run: |
          python scripts/validate_bus.py
          python -m unittest tests.test_scheduler_admission_construction
          python -m unittest discover -s tests -p 'test_*.py'

  trusted-seed-amendment:
    needs: candidate-diagnostics
    if: always()
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Use frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Clone exact accepted-main amendment and candidate data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trusted
          git -C trusted fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
          git -C trusted remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Install trusted validation environment
        run: "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r trusted/requirements-validation.lock"
      - name: Assert frozen trusted validator environment
        run: python3 trusted/scripts/assert_validator_environment.py
      - name: Publish one-shot root epoch11 seed-completeness amendment decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_RUN_ATTEMPT: ${{ needs.candidate-diagnostics.outputs.run_attempt }}
          CANDIDATE_DIAGNOSTICS_RESULT: ${{ needs.candidate-diagnostics.result }}
          DIAGNOSED_PR_NUMBER: ${{ needs.candidate-diagnostics.outputs.pr_number }}
          DIAGNOSED_HEAD_SHA: ${{ needs.candidate-diagnostics.outputs.head_sha }}
          DIAGNOSED_BASE_SHA: ${{ needs.candidate-diagnostics.outputs.base_sha }}
        run: cd trusted && python3 scripts/reconcile_root_epoch11_stageability_repair_seed_amendment.py
