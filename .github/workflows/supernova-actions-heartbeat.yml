name: Supernova Actions Heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [supernova-actions-heartbeat]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: supernova-actions-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Publish scheduler heartbeat before any setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['TARGET_SHA']; token=os.environ['GITHUB_TOKEN']
          body={'state':'success','context':'supernova/actions-heartbeat','description':'GitHub Actions scheduler reached job start; diagnostic only'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(body).encode(),method='POST')
          req.add_header('Authorization',f'Bearer {token}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req) as r: print(r.status)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13'
      - name: Install frozen validation environment
        id: install
        continue-on-error: true
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Reconcile open Supernova PR heads
        id: reconciler
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/reconcile_open_prs.py
      - name: Publish reconciler health
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RECONCILER_OUTCOME: ${{ steps.reconciler.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['TARGET_SHA']; token=os.environ['GITHUB_TOKEN']
          install=os.environ.get('INSTALL_OUTCOME','unknown'); rec=os.environ.get('RECONCILER_OUTCOME','unknown')
          ok=(install=='success' and rec=='success')
          body={'state':'success' if ok else 'failure','context':'supernova/pr-reconciler-health','description':f'install={install}; reconciler={rec}; diagnostic only'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(body).encode(),method='POST')
          req.add_header('Authorization',f'Bearer {token}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req) as r: print(r.status)
          PY
      - name: Enforce reconciler health
        if: steps.install.outcome != 'success' || steps.reconciler.outcome != 'success'
        run: exit 1
