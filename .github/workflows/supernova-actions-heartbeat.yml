name: Supernova Actions Heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: supernova-actions-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13'
      - name: Install frozen validation environment
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock
      - name: Reconcile open Supernova PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/reconcile_open_prs.py
      - name: Publish non-authoritative Actions heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['TARGET_SHA']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=json.dumps({
                  'state': 'success',
                  'context': 'supernova/actions-heartbeat',
                  'description': 'Diagnostic heartbeat; exact-head admission is published separately',
              }).encode(),
              method='POST',
          )
          req.add_header('Authorization', f"Bearer {os.environ['GITHUB_TOKEN']}")
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')
          with urllib.request.urlopen(req) as response:
              print(response.status)
          PY
