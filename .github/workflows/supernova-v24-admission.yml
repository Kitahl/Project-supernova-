name: Supernova v2.4 Admission
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('supernova-transition-{0}', github.event.pull_request.base.ref) || format('supernova-admission-{0}', github.sha) }}
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked validator environment
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock
      - name: Static control
        id: static
        continue-on-error: true
        run: |
          python scripts/validate_bus.py
          python -m unittest discover -s tests -p 'test_*guard.py'
      - name: Report admission
        id: report
        continue-on-error: true
        run: python scripts/ci_guard.py
      - name: Transition admission
        id: transition
        continue-on-error: true
        env:
          SUPERNOVA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          SUPERNOVA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          python scripts/parent_lineage_guard.py
          python scripts/transition_guard.py
      - name: Publish exact classic statuses for task observability
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          TRANSITION_OUTCOME: ${{ steps.transition.outcome }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['TARGET_SHA'];token=os.environ['GITHUB_TOKEN']
          for context,key in [('supernova/static-control','STATIC_OUTCOME'),('supernova/report-admission','REPORT_OUTCOME'),('supernova/transition-admission','TRANSITION_OUTCOME')]:
              state='success' if os.environ[key]=='success' else 'failure'
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps({'state':state,'context':context,'description':'Project Supernova v2.4 frozen admission gate'}).encode(),method='POST')
              req.add_header('Authorization',f'Bearer {token}');req.add_header('Accept','application/vnd.github+json');req.add_header('X-GitHub-Api-Version','2022-11-28')
              with urllib.request.urlopen(req) as r: print(context,r.status,state)
          PY
      - name: Enforce all admission results
        if: steps.static.outcome != 'success' || steps.report.outcome != 'success' || steps.transition.outcome != 'success'
        run: exit 1
