name: Supernova Authority Bootstrap
run-name: Supernova Authority Bootstrap PR #${{ github.event.pull_request.number }} HEAD=${{ github.event.pull_request.head.sha }} BASE=${{ github.event.pull_request.base.sha }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: supernova-authority-bootstrap-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  candidate-diagnostics:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head with no persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use frozen Python 3.13 runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install candidate validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Run candidate diagnostics without write capability or repository secrets
        env:
          GITHUB_TOKEN: ""
        run: |
          python scripts/validate_bus.py
          python -m unittest discover -s tests -p 'test_*.py'

  trusted-bootstrap:
    needs: candidate-diagnostics
    if: needs.candidate-diagnostics.result == 'success'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Use frozen Python 3.13 runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Clone exact accepted default-branch control plane
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trusted
          cd trusted
          git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Install trusted validation environment
        run: "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r trusted/requirements-validation.lock"
      - name: Publish trusted bootstrap decision bound to diagnosed bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_DIAGNOSTICS_RESULT: ${{ needs.candidate-diagnostics.result }}
          DIAGNOSED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIAGNOSED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cd trusted && python3 scripts/reconcile_authority_bootstrap.py
      # Normal source-bound contexts are deliberately NOT republished inside this
      # still-running bootstrap workflow. The accepted-main completion workflow
      # runs scripts/reconcile_open_prs.py only after this designated run reaches
      # completed/success, so its provenance can be independently verified.
