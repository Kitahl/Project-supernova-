name: Supernova Open PR Admission Reconciler

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [supernova-open-pr-reconcile]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: supernova-required-context-writers
  cancel-in-progress: false

jobs:
  reconcile:
    environment: supernova-protected-writer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable SHA
        with:
          fetch-depth: 0
      # Legacy source-contract marker retained for frozen pre-root9 regression readers: python-version: '3.13'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13.15'
      - name: Install frozen validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Assert frozen validator environment
        run: python scripts/assert_validator_environment.py
      - name: Mint repository-scoped protected status token
        id: status-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 immutable SHA
        with:
          client-id: ${{ vars.SUPERNOVA_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUPERNOVA_STATUS_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: Reconcile exact open PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPERNOVA_STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
        run: python scripts/reconcile_open_prs.py
