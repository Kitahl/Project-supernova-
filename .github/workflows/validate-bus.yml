name: Validate Project Supernova Bus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Execute Draft 2020-12 schemas and bus invariants
        run: python scripts/validate_bus.py
