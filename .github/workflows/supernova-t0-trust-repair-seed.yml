name: Supernova T0 Trust Repair Seed

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: supernova-t0-trust-repair-seed-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  candidate-diagnostics:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'root-rotation/')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head with no persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked validation environment
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock
      - name: Candidate diagnostics only
        env:
          GITHUB_TOKEN: ""
        run: |
          python scripts/validate_bus.py
          python -m unittest discover -s tests -p 'test_*.py'

  trusted-seed:
    needs: candidate-diagnostics
    if: needs.candidate-diagnostics.result == 'success'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Use Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Clone exact accepted main seed bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trusted
          cd trusted
          git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Publish one-shot trust-repair seed decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_DIAGNOSTICS_RESULT: ${{ needs.candidate-diagnostics.result }}
          DIAGNOSED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIAGNOSED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cd trusted && python3 scripts/reconcile_t0_trust_repair_seed.py
