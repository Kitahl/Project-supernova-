name: Supernova v2.5 Candidate Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# IMPORTANT: this workflow may execute candidate-tree code, so it is deliberately
# read-only and cannot publish the three authoritative admission contexts.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('supernova-v25-diag-{0}', github.event.pull_request.number) || format('supernova-v25-diag-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13'
      - name: Install hash-locked validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Candidate diagnostics only
        run: |
          python scripts/validate_bus.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Authority notice
        run: |
          echo 'This workflow is diagnostic only.'
          echo 'Authoritative contexts are emitted only by trusted-main reconciler workflows.'
