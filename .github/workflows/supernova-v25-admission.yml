name: Supernova v2.5 Frozen Admission
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('supernova-v25-{0}', github.event.pull_request.number) || format('supernova-v25-{0}', github.sha) }}
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13'
      - name: Install hash-locked validator environment
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock
      - name: Static control
        id: static
        continue-on-error: true
        run: |
          python scripts/validate_bus.py
          python - <<'PY'
          import json, pathlib, re
          P='0aa341106cfc5b104ab9ca9c2ae116d490a258685e28d26d5435860c53bb12aa'
          state=json.loads(pathlib.Path('state/CURRENT.json').read_text())
          freeze=json.loads(pathlib.Path('config/protocol_freeze.json').read_text())
          pools=json.loads(pathlib.Path('benchmark/pool_disposition.json').read_text())
          assert state['task_network_plan_id']==P and state['protocol_version']=='2.5'
          assert freeze['frozen_protocol_version']=='2.5'
          assert pools['task_network_plan_id']==P
          for wf in pathlib.Path('.github/workflows').glob('*.yml'):
              for line in wf.read_text().splitlines():
                  if re.search(r'^\s*-\s+uses:',line):
                      ref=line.split('@',1)[1].split()[0] if '@' in line else ''
                      assert re.fullmatch(r'[0-9a-f]{40}',ref), f'unpinned action in {wf}: {line}'
          PY
          python -m unittest discover -s tests -p 'test_*guard.py'
      - name: Report admission
        id: report
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          base=os.environ.get('BASE_SHA','')
          if not base:
              raise SystemExit(0)
          changed=subprocess.check_output(['git','diff','--name-only',base+'...HEAD'],text=True).splitlines()
          if 'state/CURRENT.json' not in changed:
              print('non-transition PR: report admission N/A'); raise SystemExit(0)
          old=json.loads(subprocess.check_output(['git','show',base+':state/CURRENT.json'],text=True))
          c=old['active_cohort_id']; root=pathlib.Path('history')/c
          con=json.loads((root/'CONSOLIDATION.json').read_text())
          ver=json.loads((root/'verification.json').read_text())
          integ=json.loads((root/'integration.json').read_text())
          assert ver['verdict']=='VERIFIED_COMPLETE'
          assert ver.get('partition_exhaustive_verified') is True
          assert not ver.get('quarantined_report_refs') and not ver.get('missing_workers')
          assert ver.get('required_post_write_ci_context')=='supernova/report-admission'
          assert integ['verification_head_sha']==con['verification_head_sha']
          assert integ['verification_external_ci_context']=='supernova/report-admission'
          assert integ['verification_external_ci_status']=='PASS'
          assert integ['verification_external_ci_observed_after_receipt'] is True
          PY
      - name: Transition admission
        id: transition
        continue-on-error: true
        env:
          SUPERNOVA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          SUPERNOVA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ -z "$SUPERNOVA_BASE_SHA" ] || ! git diff --name-only "$SUPERNOVA_BASE_SHA...HEAD" | grep -qx 'state/CURRENT.json'; then
            echo 'non-transition PR: transition admission N/A'
          else
            python scripts/parent_lineage_guard.py
            python scripts/transition_guard.py
          fi
      - name: Publish three non-substitutable exact-head contexts
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          TRANSITION_OUTCOME: ${{ steps.transition.outcome }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['TARGET_SHA'];token=os.environ['GITHUB_TOKEN']
          for context,key in [('supernova/static-control','STATIC_OUTCOME'),('supernova/report-admission','REPORT_OUTCOME'),('supernova/transition-admission','TRANSITION_OUTCOME')]:
              state='success' if os.environ[key]=='success' else 'failure'
              body={'state':state,'context':context,'description':'Project Supernova protocol-2.5 frozen admission'}
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(body).encode(),method='POST')
              req.add_header('Authorization',f'Bearer {token}');req.add_header('Accept','application/vnd.github+json');req.add_header('X-GitHub-Api-Version','2022-11-28')
              with urllib.request.urlopen(req) as r: print(context,r.status,state)
          PY
      - name: Enforce all contexts
        if: steps.static.outcome != 'success' || steps.report.outcome != 'success' || steps.transition.outcome != 'success'
        run: exit 1
