name: Supernova Ruleset Attestation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: supernova-ruleset-attestation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  attest:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish effective main ruleset attestation from GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          pr = int(os.environ['PR_NUMBER'])

          def api(url, method='GET', payload=None, auth=True):
              req = urllib.request.Request(
                  url,
                  data=(json.dumps(payload).encode('utf-8') if payload is not None else None),
                  method=method,
              )
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if auth:
                  req.add_header('Authorization', 'Bearer ' + token)
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else None

          def public_get(label, url):
              try:
                  return {'ok': True, 'label': label, 'value': api(url, auth=False)}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  return {'ok': False, 'label': label, 'http_status': exc.code, 'error': raw[:4000]}
              except Exception as exc:
                  return {'ok': False, 'label': label, 'error': repr(exc)}

          base = 'https://api.github.com/repos/' + repo
          api(
              base + '/issues/' + str(pr) + '/comments',
              'POST',
              {'body': 'SUPERNOVA_RULESET_ATTESTATION_V25_STARTED — accepted-main workflow reached GitHub runner.'},
              auth=True,
          )

          effective = public_get('effective_branch_rules', base + '/rules/branches/main')
          summaries = public_get('repository_rulesets', base + '/rulesets')
          details = []
          if summaries.get('ok') and isinstance(summaries.get('value'), list):
              for item in summaries['value']:
                  rid = item.get('id') if isinstance(item, dict) else None
                  if isinstance(rid, int):
                      details.append(public_get('ruleset_' + str(rid), base + '/rulesets/' + str(rid)))
          branch = public_get('branch_main', base + '/branches/main')
          actions_app = public_get('github_actions_app', 'https://api.github.com/apps/github-actions')

          branch_value = branch.get('value') if branch.get('ok') else {}
          app_value = actions_app.get('value') if actions_app.get('ok') else {}
          attestation = {
              'schema_version': 'PS-RULESET-ATTESTATION-1',
              'repository': repo,
              'branch': 'main',
              'main_sha': ((branch_value or {}).get('commit') or {}).get('sha'),
              'effective_branch_rules': effective,
              'repository_rulesets': summaries,
              'repository_ruleset_details': details,
              'github_actions_app': {
                  'query': actions_app,
                  'id': (app_value or {}).get('id'),
                  'slug': (app_value or {}).get('slug'),
                  'name': (app_value or {}).get('name'),
                  'owner_login': (((app_value or {}).get('owner') or {}).get('login')),
              },
          }
          body = (
              'SUPERNOVA_RULESET_ATTESTATION_V25_BEGIN\n```json\n'
              + json.dumps(attestation, sort_keys=True, indent=2)
              + '\n```\nSUPERNOVA_RULESET_ATTESTATION_V25_END'
          )
          if len(body) > 64000:
              body = (
                  'SUPERNOVA_RULESET_ATTESTATION_V25_BEGIN\n```json\n'
                  + json.dumps({**attestation, 'repository_ruleset_details': 'OMITTED_COMMENT_SIZE'}, sort_keys=True, indent=2)
                  + '\n```\nSUPERNOVA_RULESET_ATTESTATION_V25_END'
              )
          api(base + '/issues/' + str(pr) + '/comments', 'POST', {'body': body}, auth=True)
          print(json.dumps(attestation, sort_keys=True))
          PY
