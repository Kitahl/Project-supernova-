name: Supernova Bootstrap Completion Reconcile

on:
  workflow_run:
    workflows: ["Supernova Authority Bootstrap"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

concurrency:
  group: supernova-bootstrap-completion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact accepted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install trusted validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Assert frozen validator environment
        run: python scripts/assert_validator_environment.py
      - name: Reconcile open PRs using exact completed designated-run provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPLETED_BOOTSTRAP_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/reconcile_open_prs.py
