name: Supernova Bootstrap Completion Reconcile

on:
  workflow_run:
    workflows: ["Supernova Authority Bootstrap"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

concurrency:
  group: supernova-bootstrap-completion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Use frozen Python 3.13 runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Clone exact accepted default-branch authority bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trusted
          cd trusted
          git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Install frozen trusted validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r trusted/requirements-validation.lock"
      - name: Reconcile normal contexts only after exact bootstrap run is complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cd trusted && python scripts/reconcile_open_prs.py
