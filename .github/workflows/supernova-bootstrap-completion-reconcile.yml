name: Supernova Bootstrap Completion Reconcile

on:
  workflow_run:
    workflows: ["Supernova Authority Bootstrap"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: supernova-required-context-writers
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success'
    environment: supernova-protected-writer
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact accepted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install trusted validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Assert frozen validator environment
        run: python scripts/assert_validator_environment.py
      - name: Mint repository-scoped protected status token
        id: status-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 immutable SHA
        with:
          client-id: ${{ vars.SUPERNOVA_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUPERNOVA_STATUS_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: Reconcile open PRs using exact completed designated-run provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPERNOVA_STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          COMPLETED_BOOTSTRAP_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/reconcile_open_prs.py
