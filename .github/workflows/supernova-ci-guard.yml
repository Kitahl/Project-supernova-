name: Supernova CI Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: supernova-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Execute frozen validator, semantic guard, and adversarial controls
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rc=0
          python -m unittest discover -s tests -p 'test_ci_guard.py' || rc=1
          python scripts/validate_bus.py || rc=1
          python scripts/ci_guard.py || rc=1
          exit "$rc"
      - name: Publish connector-visible commit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          state = "success" if os.environ["VALIDATION_OUTCOME"] == "success" else "failure"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          url = f"https://api.github.com/repos/{repo}/statuses/{sha}"
          body = json.dumps({
              "state": state,
              "context": "supernova/ci-guard",
              "description": "Frozen bus validator + semantic Git-binding guard",
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST")
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Authorization", f"Bearer {os.environ['GITHUB_TOKEN']}")
          req.add_header("X-GitHub-Api-Version", "2022-11-28")
          with urllib.request.urlopen(req) as response:
              print(response.status)
          PY
      - name: Enforce validation result
        if: steps.validation.outcome != 'success'
        run: exit 1
