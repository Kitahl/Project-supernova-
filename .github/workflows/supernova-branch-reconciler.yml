name: Supernova Branch Reconciler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [supernova-branch-reconcile]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: supernova-branch-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       startsWith(github.event.pull_request.head.ref, 'ps/stage/'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install hash-locked validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Assert frozen validator environment
        run: python scripts/assert_validator_environment.py
      - name: Reconcile active exact branch heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPERNOVA_WORKER_AUTH_KEYS_JSON: ${{ secrets.SUPERNOVA_WORKER_AUTH_KEYS_JSON }}
          SUPERNOVA_STAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPERNOVA_STAGE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUPERNOVA_STAGE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/reconcile_branch_statuses.py
