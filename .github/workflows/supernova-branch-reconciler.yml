name: Supernova Branch Reconciler

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [supernova-branch-reconcile]

permissions:
  contents: read
  statuses: write

concurrency:
  group: supernova-branch-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-validation.lock"
      - name: Reconcile active exact branch heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/reconcile_branch_statuses.py
