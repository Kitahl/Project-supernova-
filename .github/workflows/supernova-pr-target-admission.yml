name: Supernova PR Target Admission Bridge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  repository_dispatch:
    types: [supernova-pr-target-admission]

concurrency:
  group: supernova-required-context-writers
  cancel-in-progress: false
  queue: max

jobs:
  structural-pr-target-heartbeat:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    permissions:
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - name: Publish trusted-trigger heartbeat before setup
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['TARGET_SHA']; token=os.environ['GITHUB_TOKEN']
          body={'state':'success','context':'supernova/actions-pr-target-heartbeat','description':'Trusted pull_request_target runner started; diagnostic only'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(body,allow_nan=False).encode(),method='POST')
          req.add_header('Authorization',f'Bearer {token}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req,timeout=30) as r: print('heartbeat',sha,r.status)
          PY
  reconcile:
    needs: structural-pr-target-heartbeat
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    environment: supernova-protected-writer
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    steps:
      # Legacy source-contract marker retained for frozen pre-root9 regression readers: python-version: '3.13'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13.15'
      - name: Clone exact accepted default-branch control plane
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trusted
          cd trusted
          git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Install frozen trusted validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r trusted/requirements-validation.lock"
      - name: Assert frozen trusted validator environment
        run: python trusted/scripts/assert_validator_environment.py
      - name: Mint repository-scoped protected status token
        id: status-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 immutable SHA
        with:
          client-id: ${{ vars.SUPERNOVA_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUPERNOVA_STATUS_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: Reconcile open PRs using trusted-main executable bytes only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPERNOVA_STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
        run: cd trusted && python scripts/reconcile_open_prs.py
      - name: Diagnose authority-bootstrap structural eligibility using accepted-main bytes only
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: cd trusted && python scripts/diagnose_authority_bootstrap.py
  structural-ruleset-attestation:
    needs: reconcile
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable SHA
        with:
          python-version: '3.13.15'
      - name: Clone exact accepted default-branch control plane
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trusted
      - name: Install frozen trusted validation environment
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r trusted/requirements-validation.lock"
      - name: Assert frozen trusted validator environment
        run: python trusted/scripts/assert_validator_environment.py
      - name: Attest effective main rules using trusted-main executable bytes only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: cd trusted && python scripts/reconcile_ruleset_attestation.py
